<title>ALL APPLICATION</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#0f0f1e;color:white;min-height:100vh}
.box{max-width:500px;margin:0 auto;padding:16px;width:100%}
.header{text-align:center;padding:24px 0}
.logo{font-size:26px;font-weight:800;background:linear-gradient(180deg,#fff 50%,#00e5ff 65%,#ff4081 80%,#ffea00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#888;font-size:13px;margin-top:6px}
.search{width:100%;background:#1c1c38;border:1px solid rgba(255,255,255,0.12);padding:14px 18px;border-radius:28px;color:white;outline:none;margin:10px 0 20px}
.card{background:#1c1c38;border:1px solid rgba(0,229,255,0.2);border-radius:22px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;gap:12px;align-items:center}
.icon-wrap{width:56px;height:56px;background:#12122a;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,0.08)}
.icon-wrap img{width:100%;height:100%;object-fit:cover}
.icon-wrap span{font-size:26px}
.info{flex:1;min-width:0}
.info h3{font-size:15px;word-break:break-all}
.info p{font-size:12px;color:#8b8bb0;margin:4px 0 8px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#10102a;padding:5px 10px;border-radius:20px;font-size:10px;color:#aaa;border:1px solid rgba(255,255,255,0.06)}
.tag.size{background:#00e5ff18;color:#00e5ff;border-color:#00e5ff30}
.btn-down{width:100%;background:linear-gradient(#00e5ff,#00b8d4);color:#000;padding:12px;border-radius:30px;border:none;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #008a9e}
.btn-down:active{transform:translateY(3px);box-shadow:0 1px 0 #008a9e}
</style>
</head>
<body>
<div class="box">
  <div class="header"><div class="logo">ALL APPS</div><div class="sub">Beberapa Apps Dan Games</div></div>
  <input id="search" class="search" placeholder="🔍 Cari file..." onkeyup="filter()">

  <div id="list">
    <!-- CONTOH 1 -->
    <div class="card" data-url="./files/BlockyBlast.apk" data-icon="./images/icon-blocky-blast.png" data-name="Blocky Blast" data-desc="Versi v5.0.8">
      <div class="card-top">
        <div class="icon-wrap"><span>⏳</span></div>
        <div class="info"><h3 class="fname"></h3><p class="fdesc">Mengecek...</p><div class="meta"><span class="tag">v5.0.8</span><span class="tag size">...</span><span class="tag type"></span></div></div>
      </div>
      <button class="btn-down">DOWNLOAD</button>
    </div>

    <!-- CONTOH 2 -->
    <div class="card" data-url="./files/UlarTangga.apk" data-icon="./images/icon-ular-tangga.png" data-name="Ular Tangga" data-desc="versi v11.0.18">
      <div class="card-top">
        <div class="icon-wrap"><span>⏳</span></div>
        <div class="info"><h3 class="fname"></h3><p class="fdesc">Mengecek...</p><div class="meta"><span class="tag">v11.0.18</span><span class="tag size">...</span><span class="tag type"></span></div></div>
      </div>
      <button class="btn-down">DOWNLOAD</button>
    </div>

    <!-- CONTOH 3 -->
    <div class="card" data-url="./files/MySite.apk" data-icon="./images/icon-my-site.png" data-name="My Site" data-desc="versi v0.0.0">
      <div class="card-top">
        <div class="icon-wrap"><span>⏳</span></div>
        <div class="info"><h3 class="fname"></h3><p class="fdesc">Mengecek...</p><div class="meta"><span class="tag">v0.0.0</span><span class="tag size">...</span><span class="tag type"></span></div></div>
      </div>
      <button class="btn-down">DOWNLOAD</button>
    </div>

  </div>
</div>

<script>
function formatSize(b){ if(!b) return '...'; const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k)); return (b/Math.pow(k,i)).toFixed(1)+' '+s[i]; }

async function processCard(card){
  const url = card.dataset.url;
  const iconManual = card.dataset.icon;
  const customName = card.dataset.name;
  const customDesc = card.dataset.desc;

  const filename = url.split('/').pop();
  const ext = filename.split('.').pop().toLowerCase();
  const fnameEl = card.querySelector('.fname');
  const sizeEl = card.querySelector('.size');
  const typeEl = card.querySelector('.type');
  const iconWrap = card.querySelector('.icon-wrap');
  const descEl = card.querySelector('.fdesc');
  const btn = card.querySelector('.btn-down');

  // Set nama & deskripsi
  fnameEl.textContent = customName || filename;
  typeEl.textContent = ext.toUpperCase();
  descEl.textContent = customDesc || filename;
  btn.onclick = ()=>{ const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); };

  // Cek ukuran file
  try{
    const head = await fetch(url,{method:'HEAD'});
    const len = head.headers.get('content-length');
    if(len) sizeEl.textContent = formatSize(parseInt(len));
    else throw 'no length';
  }catch(e){
    try{
      const blob = await fetch(url).then(r=>r.blob());
      sizeEl.textContent = formatSize(blob.size);
    }catch{ sizeEl.textContent = '...'; }
  }

  // LOGIKA ICON MANUAL DARI./images/
  if(iconManual){
    const img = new Image();
    img.onload = ()=>{ iconWrap.innerHTML = `<img src="${iconManual}" />`; };
    img.onerror = ()=>{
      iconWrap.innerHTML = `<span>📁</span>`;
      console.log('Icon tidak ditemukan:', iconManual);
    };
    img.src = iconManual;
  } else {
    const fallbacks = {apk:'📦', zip:'🗜️', exe:'💻'};
    iconWrap.innerHTML = `<span>${fallbacks[ext]||'📁'}</span>`;
  }
}

document.querySelectorAll('.card').forEach(processCard);

function filter(){
  let q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (c.dataset.url + c.dataset.name).toLowerCase().includes(q)? 'flex' : 'none';
  });
}
</script>
</body>
</html>
